plugins { id 'com.android.application' }

android {
    namespace 'com.aizora.aicamera'
    compileSdk 35
    defaultConfig {
        // Separate package: diagnostic APK will not overwrite the installed camera app.
        applicationId 'com.aizora.aicamera.diagnostic'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '2.2-diagnostic'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No VLC, AndroidX, or camera libraries in this startup-only diagnostic build.
