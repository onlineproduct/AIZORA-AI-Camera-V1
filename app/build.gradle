plugins { id 'com.android.application' }

android {
    namespace 'com.aizora.aicamera'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aizora.aicamera'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// VLC 3.5.1 brings legacy split Kotlin JDK7/JDK8 artifacts that duplicate
// classes already present in the newer kotlin-stdlib. Exclude the split jars.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.5.1'
    implementation 'androidx.activity:activity:1.9.3'
}
